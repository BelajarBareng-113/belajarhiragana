<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Bahasa Jepang</title>
<style>
  :root {
    --bg: #f2f2f2;
    --gray1: #8a8a8a;
    --gray2: #bdbdbd;
    --gray3: #e0e0e0;
    --white: #fff;
    --black: #000;
    --green: #2e7d32;
    --red: #c62828;
  }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, Arial, sans-serif; }
  body { background: var(--bg); padding: 16px; }

 .container { max-width: 900px; margin: 0 auto; }

 .header {
    background: var(--gray1);
    color: var(--black);
    padding: 16px 20px;
    border-radius: 10px;
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 500;
    margin-bottom: 16px;
  }

 .card {
    background: var(--gray1);
    border-radius: 12px;
    padding: 16px;
  }

 .tabs { display: flex; gap: 4px; margin-bottom: -1px; flex-wrap: wrap; }
 .tab {
    padding: 10px 20px;
    background: var(--gray2);
    border: none;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    font-size: 16px;
  }
 .tab.active { background: var(--white); }

 .content {
    background: var(--white);
    border-radius: 0 10px 10px 10px;
    padding: 20px;
  }

 .layout { display: flex; gap: 20px; flex-wrap: wrap; }
 .quiz-area { flex: 2; min-width: 240px; }
 .mode-area { flex: 1; min-width: 240px; }

 .char-box {
    background: var(--gray3);
    border-radius: 10px;
    padding: 40px 20px;
    display: flex; justify-content: center; align-items: center;
    margin-bottom: 12px;
  }
 .char {
    background: var(--white);
    padding: 20px 40px;
    font-size: clamp(32px, 10vw, 64px);
    border-radius: 8px;
    min-width: 120px;
    text-align: center;
  }

 .btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
  }
 .btn-stop { background: var(--gray2); margin-bottom: 8px; }
 .btn-start { background: var(--gray3); }
 .input {
    width: 100%;
    padding: 10px;
    border: 2px solid var(--black);
    border-radius: 6px;
    font-size: 16px;
    text-transform: uppercase;
  }

 .mode-box {
    background: var(--gray2);
    padding: 16px;
    border-radius: 10px;
  }
 .mode-title { font-weight: bold; margin-bottom: 10px; border-bottom: 2px solid var(--black); padding-bottom: 6px;}
 .radio { display: flex; align-items: center; gap: 8px; margin: 8px 0; }

 .hidden { display: none!important; }

  /* Popup */
 .popup-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; justify-content: center; align-items: center;
    z-index: 10;
  }
 .popup {
    background: var(--white); padding: 24px; border-radius: 12px;
    text-align: center; min-width: 300px;
  }
 .popup h2 { margin-bottom: 16px; }
 .score-row { display: flex; justify-content: space-around; margin: 16px 0; }
 .score-item.label { font-size: 14px; color: #555; }
 .score-item.value { font-size: 28px; font-weight: bold; }
 .value.benar { color: var(--green); }
 .value.salah { color: var(--red); }

  @media(max-width: 640px){
   .layout { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">Latihan Bahasa Jepang</div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" data-tab="Hiragana">Hiragana</button>
      <button class="tab" data-tab="Katakana">Katakana</button>
      <!--<button class="tab" data-tab="Angka">Angka</button>
      <button class="tab" data-tab="Kanji">Kanji</button>-->
    </div>

    <div class="content">
      <!-- HALAMAN MODE -->
      <div id="modePage">
        <div class="mode-box">
          <div class="mode-title">Mode</div>
          <label class="radio"><input type="radio" name="mode" value="Dasar" checked> Dasar</label>
          <label class="radio"><input type="radio" name="mode" value="TentenMaru"> Tenten & Maru</label>
          <label class="radio"><input type="radio" name="mode" value="Youon"> Youon</label>
          <label class="radio"><input type="radio" name="mode" value="Lengkap"> Lengkap</label>
          <button class="btn btn-start" id="btnMulai">Mulai</button>
        </div>
      </div>

      <!-- HALAMAN KUIS -->
      <div id="quizPage" class="hidden">
        <div class="layout">
          <div class="quiz-area">
            <div class="char-box">
              <div class="char" id="charDisplay">-</div>
            </div>
            <button class="btn btn-stop" id="btnBerhenti">Berhenti</button>
            <input type="text" class="input" id="inputJawaban" placeholder="Ketik romaji">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- POPUP SKOR -->
<div id="popupSkor" class="popup-overlay hidden">
  <div class="popup">
    <h2>Hasil Latihan</h2>
    <div class="score-row">
      <div class="score-item">
        <div class="label">Benar</div>
        <div class="value benar" id="skorBenar">0</div>
      </div>
      <div class="score-item">
        <div class="label">Salah</div>
        <div class="value salah" id="skorSalah">0</div>
      </div>
    </div>
    <button class="btn btn-start" id="btnTutupPopup">OK</button>
  </div>
</div>

  initElements() {
    this.modePage = document.getElementById('modePage');
    this.quizPage = document.getElementById('quizPage');
    this.charDisplay = document.getElementById('charDisplay');
    this.inputJawaban = document.getElementById('inputJawaban');
    this.modeAktifSpan = document.getElementById('modeAktif');
    this.popupSkor = document.getElementById('popupSkor');
    this.skorBenar = document.getElementById('skorBenar');
    this.skorSalah = document.getElementById('skorSalah');
  }

  initEvents() {
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', (e) => this.gantiTab(e.target.dataset.tab));
    });

    document.getElementById('btnMulai').addEventListener('click', () => this.mulai());
    document.getElementById('btnBerhenti').addEventListener('click', () => this.berhenti());
    document.getElementById('btnTutupPopup').addEventListener('click', () => this.tutupPopup());

    this.inputJawaban.addEventListener('keypress', (e) => {
      if(e.key === 'Enter') this.cekJawaban();
    });

    document.querySelectorAll('input[name="mode"]').forEach(r => {
      r.addEventListener('change', (e) => this.state.modeAktif = e.target.value);
    });
  }

  gantiTab(tab) {
    this.state.tabAktif = tab;
    if(!this.state.diKuis) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
      this.soalBaru();
    }
  }

  mulai() {
    const modeDipilih = document.querySelector('input[name="mode"]:checked').value;
    this.state.modeAktif = modeDipilih;
    this.state.diKuis = true;
    this.state.benar = 0;
    this.state.salah = 0;

    this.modePage.classList.add('hidden');
    this.quizPage.classList.remove('hidden');
    this.modeAktifSpan.textContent = this.state.modeAktif;
    this.soalBaru();
    this.inputJawaban.focus();
  }

  kembaliKeMode() {
    this.quizPage.classList.add('hidden');
    this.modePage.classList.remove('hidden');
  }

  berhenti() {
    this.soalBaru();
    this.tampilkanPopup();
  }

  tampilkanPopup() {
    this.skorBenar.textContent = this.state.benar;
    this.skorSalah.textContent = this.state.salah;
    this.popupSkor.classList.remove('hidden');
  }

  tutupPopup() {
    this.state.diKuis = false;
    this.popupSkor.classList.add('hidden');
    this.kembaliKeMode(); // langsung balik ke pilih mode
  }

  soalBaru() {
    const bank = this.data[this.state.tabAktif]?.[this.state.modeAktif] || this.data[this.state.tabAktif].Lengkap;
    const soal = bank[Math.floor(Math.random() * bank.length)];
    this.charDisplay.textContent = soal[0];
    this.state.jawabanBenar = soal[1].toLowerCase();
    this.inputJawaban.value = '';
  }

  cekJawaban() {
    const jawaban = this.inputJawaban.value.trim().toLowerCase();
    if(jawaban === '') return;

    if(jawaban === this.state.jawabanBenar) {
      this.state.benar++;
    } else {
      this.state.salah++;
    }
    this.soalBaru();
  }

});

</body>
</html>
